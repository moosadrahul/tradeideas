services:
  - type: web
    name: tradeideas
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt || true
    startCommand: python3 server.py
    envVars:
      - key: TWELVE_DATA_API_KEY
        value: 0181551be7064c2e8010fa600f5c817d
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
    disk:
      name: data
      mountPath: /var/data
      sizeGB: 1
